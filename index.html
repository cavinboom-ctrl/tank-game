<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f9bea">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>꼬마 포격대</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(11px,2.3vh,22px)}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#123;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-weight:800;color:#fff}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:none}
input{font:inherit}

/* ---------- 상단 표시 ---------- */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;
  padding:.7rem 1rem;gap:1rem;pointer-events:none}
.pl{flex:1;max-width:36%;background:rgba(10,25,50,.55);border:.18rem solid rgba(255,255,255,.55);border-radius:1.1rem;
  padding:.45rem .8rem .6rem;backdrop-filter:blur(4px);transition:transform .25s,box-shadow .25s,border-color .25s}
.pl.on{transform:scale(1.05);border-color:#ffe45c;box-shadow:0 0 1.2rem rgba(255,228,92,.8)}
.pname{display:flex;align-items:center;gap:.5rem;font-size:1.25rem;text-shadow:0 .12rem 0 rgba(0,0,0,.45)}
.pl.r .pname{flex-direction:row-reverse}
.dot{width:1.1rem;height:1.1rem;border-radius:50%;border:.15rem solid #fff;flex:none}
.hp{position:relative;height:1.35rem;margin-top:.3rem;border-radius:.7rem;background:rgba(0,0,0,.5);overflow:hidden;
  border:.12rem solid rgba(255,255,255,.7)}
.hp i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:.6rem;
  background:linear-gradient(#b6ff7a,#3ecb3e 55%,#1f9a2c);transition:width .35s}
.pl.r .hp i{left:auto;right:0}
.hp i.mid{background:linear-gradient(#ffe98a,#f5b82e 55%,#d98a12)}
.hp i.low{background:linear-gradient(#ff9a8a,#ee4433 55%,#b81c14)}
.hp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.95rem;
  text-shadow:0 0 .2rem #000,0 .1rem 0 #000}
#mid{display:flex;flex-direction:column;align-items:center;gap:.4rem}
#windBox{background:rgba(10,25,50,.55);border:.18rem solid rgba(255,255,255,.55);border-radius:1.1rem;
  padding:.3rem 1.1rem .4rem;text-align:center;min-width:9rem;backdrop-filter:blur(4px)}
#windLbl{font-size:.85rem;opacity:.9}
#windArrow{font-size:1.25rem;letter-spacing:.1rem;color:#bff3ff;white-space:nowrap;text-shadow:0 .1rem 0 rgba(0,0,0,.5)}
#btnPause{pointer-events:auto;width:3.2rem;height:3.2rem;border-radius:50%;font-size:1.3rem;
  background:linear-gradient(#fff,#cfe2f5);color:#235;box-shadow:0 .25rem 0 #7c93ad,0 .4rem .6rem rgba(0,0,0,.3)}
#btnPause:active{transform:translateY(.2rem);box-shadow:0 .05rem 0 #7c93ad}

/* ---------- 하단 조작판 ---------- */
#panel{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:stretch;gap:.6rem;padding:.55rem .8rem;
  padding-bottom:max(.55rem,env(safe-area-inset-bottom));
  background:linear-gradient(rgba(28,48,84,.9),rgba(12,24,48,.96));border-top:.2rem solid rgba(255,255,255,.35);
  box-shadow:0 -.4rem 1.2rem rgba(0,0,0,.35)}
#panel.dis{pointer-events:none}
#panel.dis>*{opacity:.45}
.grp{background:rgba(255,255,255,.1);border-radius:1rem;padding:.35rem .55rem;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:.25rem}
.grp .lbl{font-size:.85rem;opacity:.85;line-height:1}
.grp .row{display:flex;align-items:center;gap:.4rem}
.rb{width:3.3rem;height:3.3rem;border-radius:50%;font-size:1.5rem;line-height:1;flex:none;
  background:linear-gradient(#ffffff,#cfe2f5);color:#1d3c66;box-shadow:0 .28rem 0 #7c93ad,0 .4rem .5rem rgba(0,0,0,.3)}
.rb:active,.rb.act{transform:translateY(.22rem);box-shadow:0 .06rem 0 #7c93ad;background:linear-gradient(#ffe98a,#ffd23c)}
.val{min-width:3.6rem;text-align:center;font-size:1.5rem;text-shadow:0 .12rem 0 rgba(0,0,0,.45)}
.bar{width:100%;height:.55rem;border-radius:.3rem;background:rgba(0,0,0,.45);overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:.3rem;background:linear-gradient(90deg,#7df27d,#ffe14a 60%,#ff5a3c)}
#fuel{background:linear-gradient(90deg,#ffb02e,#ffe14a)}
#gWeap{flex:1;flex-direction:row;gap:.45rem;justify-content:flex-start;overflow:hidden;padding:.35rem .5rem}
.wp{position:relative;height:100%;min-width:0;flex:1 1 0;max-width:6.4rem;border-radius:.9rem;padding:.2rem .3rem;
  background:linear-gradient(#5a78a8,#34507e);box-shadow:0 .25rem 0 #1c2f52;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.1rem;border:.18rem solid transparent}
.wp .ic{font-size:1.7rem;line-height:1.1}
.wp .nm{font-size:.78rem;white-space:nowrap}
.wp .ct{position:absolute;right:-.1rem;top:-.1rem;background:#ff5a3c;border-radius:1rem;font-size:.8rem;
  padding:.05rem .45rem;border:.12rem solid #fff}
.wp.sel{background:linear-gradient(#ffe98a,#ffb62e);color:#4a2a00;border-color:#fff;box-shadow:0 .25rem 0 #a86a00,0 0 1rem rgba(255,220,90,.8)}
.wp.out{opacity:.35;pointer-events:none}
#gWeap.many{justify-content:center}
.wp.cur{flex:1 1 auto;max-width:13rem;flex-direction:row;gap:.6rem;padding:.2rem .9rem}
.wp.cur .ic{font-size:2.3rem}
.wp.cur .nm{font-size:1.15rem;text-align:left;line-height:1.25;white-space:normal}
.wp.cur .nm small{display:block;font-size:.8rem;opacity:.8}
#wpick{position:absolute;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;
  padding:.8rem;border-radius:1.5rem;background:linear-gradient(rgba(34,58,104,.97),rgba(16,30,62,.98));
  border:.22rem solid rgba(255,255,255,.6);box-shadow:0 1rem 2.5rem rgba(0,0,0,.5);width:min(96vw,58rem)}
#wpick .wp{height:6.6rem;max-width:none;flex:none}
#wpick .wp .ic{font-size:2.1rem}
#wpick .wp .nm{font-size:1rem}
#wpick .wp .ds{font-size:.72rem;font-weight:600;opacity:.9;white-space:nowrap}
#wpick .wp .ct{font-size:.9rem;right:.2rem;top:-.4rem}
#fire{flex:none;width:9.5rem;border-radius:1.3rem;font-size:2.1rem;letter-spacing:.1rem;
  background:linear-gradient(#ff9d6a,#f4502a 55%,#d5300f);box-shadow:0 .45rem 0 #8c1c05,0 .7rem 1rem rgba(0,0,0,.4);
  text-shadow:0 .16rem 0 rgba(0,0,0,.35);border:.2rem solid rgba(255,255,255,.75)}
#fire:active{transform:translateY(.35rem);box-shadow:0 .1rem 0 #8c1c05}

/* ---------- 알림 ---------- */
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:3.6rem;pointer-events:none;opacity:0;
  text-shadow:0 .25rem 0 rgba(0,0,0,.4),0 0 1.5rem rgba(0,0,0,.5);-webkit-text-stroke:.12rem rgba(20,40,80,.9);paint-order:stroke fill}
#banner.show{animation:ban 1.25s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.12)}30%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#hint{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#1d3c66;
  padding:.7rem 1.4rem;border-radius:1.4rem;font-size:1.5rem;box-shadow:0 .4rem 1rem rgba(0,0,0,.35);pointer-events:none;
  animation:bob 1.2s ease-in-out infinite alternate;white-space:nowrap}
@keyframes bob{to{transform:translate(-50%,-.5rem)}}

/* ---------- 메뉴 화면 ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
  padding:1rem;background:rgba(8,20,44,.38);overflow:auto}
.card{background:linear-gradient(rgba(34,58,104,.94),rgba(16,30,62,.96));border:.22rem solid rgba(255,255,255,.6);
  border-radius:1.8rem;padding:1.3rem 1.6rem;box-shadow:0 1rem 2.5rem rgba(0,0,0,.45);max-width:96%;
  display:flex;flex-direction:column;align-items:center;gap:.9rem}
h1.logo{font-size:5.4rem;line-height:1;letter-spacing:.15rem;color:#ffe45c;
  -webkit-text-stroke:.28rem #b4380c;paint-order:stroke fill;
  text-shadow:0 .4rem 0 #7a1f00,0 .8rem 1.4rem rgba(0,0,0,.45);animation:logo 2.2s ease-in-out infinite alternate}
@keyframes logo{to{transform:translateY(-.5rem) rotate(-1deg)}}
.sub{font-size:1.3rem;text-shadow:0 .12rem 0 rgba(0,0,0,.5);margin-bottom:.6rem}
h2{font-size:2rem;text-shadow:0 .15rem 0 rgba(0,0,0,.4)}
.btn{min-width:17rem;padding:.85rem 1.6rem;border-radius:1.3rem;font-size:1.65rem;
  background:linear-gradient(#7fd4ff,#2f9bea 55%,#1b74c4);box-shadow:0 .4rem 0 #0f4a86,0 .6rem .9rem rgba(0,0,0,.35);
  border:.2rem solid rgba(255,255,255,.75);text-shadow:0 .14rem 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(.3rem);box-shadow:0 .1rem 0 #0f4a86}
.btn.o{background:linear-gradient(#ffc27a,#ff8a2e 55%,#e2620c);box-shadow:0 .4rem 0 #8f3a00,0 .6rem .9rem rgba(0,0,0,.35)}
.btn.g{background:linear-gradient(#b6f58a,#4fc23e 55%,#2c9a26);box-shadow:0 .4rem 0 #17601a,0 .6rem .9rem rgba(0,0,0,.35)}
.btn.s{min-width:0;font-size:1.15rem;padding:.55rem 1.1rem;background:linear-gradient(#f2f6fb,#c3d3e6);color:#1d3c66;
  text-shadow:none;box-shadow:0 .3rem 0 #6f85a0}
.btn.s:active{box-shadow:0 .08rem 0 #6f85a0}
.btn.d{background:linear-gradient(#ff9a8a,#e8402c);box-shadow:0 .3rem 0 #7c1408}
.rowb{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.lvls{display:flex;gap:.7rem;flex-wrap:nowrap;justify-content:center;max-width:100%}
.lv{width:11.2rem;border-radius:1.3rem;padding:.7rem .5rem .8rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;
  background:linear-gradient(#6f96d8,#35579a);border:.2rem solid rgba(255,255,255,.7);box-shadow:0 .4rem 0 #18305e}
.lv:active{transform:translateY(.25rem);box-shadow:0 .1rem 0 #18305e}
.lv .ic{font-size:2.8rem;line-height:1.1}
.lv .nm{font-size:1.4rem}
.lv .ds{font-size:.82rem;font-weight:600;line-height:1.35;text-align:center;min-height:3.4rem;opacity:.95}
.lv .st{font-size:1.3rem;color:#ffe45c;letter-spacing:.1rem}
.lv.lock{background:linear-gradient(#77808f,#474e5c);box-shadow:0 .4rem 0 #2a2f39;pointer-events:none}
.lv.lock .ic,.lv.lock .nm,.lv.lock .ds{opacity:.55}
.duo{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.pbox{border-radius:1.2rem;padding:.7rem .9rem;background:rgba(255,255,255,.1);display:flex;flex-direction:column;gap:.5rem;align-items:center}
.pbox input{width:11rem;text-align:center;font-size:1.35rem;border-radius:.8rem;border:.18rem solid #fff;padding:.3rem;color:#1d3c66;
  -webkit-user-select:text;user-select:text;touch-action:auto}
.seg{display:flex;gap:.3rem}
.seg button{padding:.45rem .7rem;border-radius:.8rem;font-size:1rem;background:rgba(255,255,255,.18)}
.seg button.sel{background:linear-gradient(#ffe98a,#ffb62e);color:#4a2a00}
.small{font-size:.95rem;font-weight:600;opacity:.9;text-align:center;line-height:1.5}
.stars{font-size:2.6rem;color:#ffe45c;letter-spacing:.3rem;text-shadow:0 .15rem 0 rgba(0,0,0,.4)}
#rotate{position:absolute;inset:0;background:#123a6a;display:none;align-items:center;justify-content:center;
  font-size:1.8rem;text-align:center;padding:2rem;z-index:99;line-height:1.6}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="pl" id="pl0"><div class="pname"><span class="dot" id="d0"></span><span id="n0"></span></div><div class="hp"><i id="hp0"></i><span id="hpt0"></span></div></div>
  <div id="mid">
    <div id="windBox"><div id="windLbl">바람</div><div id="windArrow">없음</div></div>
    <button id="btnPause" aria-label="멈춤">Ⅱ</button>
  </div>
  <div class="pl r" id="pl1"><div class="pname"><span class="dot" id="d1"></span><span id="n1"></span></div><div class="hp"><i id="hp1"></i><span id="hpt1"></span></div></div>
</div>

<div id="panel" class="hidden">
  <div class="grp" id="gMove">
    <div class="lbl">이동</div>
    <div class="row"><button class="rb" id="mvL">◀</button><button class="rb" id="mvR">▶</button></div>
    <div class="bar"><i id="fuel"></i></div>
  </div>
  <div class="grp">
    <div class="lbl">각도</div>
    <div class="row"><button class="rb" id="aM">－</button><div class="val" id="aV">45°</div><button class="rb" id="aP">＋</button></div>
  </div>
  <div class="grp">
    <div class="lbl">힘</div>
    <div class="row"><button class="rb" id="pM">－</button><div class="val" id="pV">50</div><button class="rb" id="pP">＋</button></div>
    <div class="bar"><i id="pBar"></i></div>
  </div>
  <div class="grp" id="gWeap"></div>
  <button id="fire">발사!</button>
</div>

<div id="wpick" class="hidden"></div>
<div id="banner"></div>
<div id="hint" class="hidden"></div>

<div class="screen" id="sTitle">
  <h1 class="logo">꼬마 포격대</h1>
  <div class="sub">각도와 힘을 맞춰 포탄을 쏴요!</div>
  <button class="btn o" data-go="levels">🤖 컴퓨터와 대결</button>
  <button class="btn g" data-go="duo">👨‍👧 둘이서 대결</button>
  <div class="rowb">
    <button class="btn s" data-go="set">⚙️ 설정</button>
    <button class="btn s" id="btnFull">⛶ 전체 화면</button>
  </div>
</div>

<div class="screen hidden" id="sLevels">
  <div class="card">
    <h2>단계를 골라요</h2>
    <div class="lvls" id="lvList"></div>
    <div class="small">컴퓨터를 3번 이기면 다음 단계가 열려요</div>
    <button class="btn s" data-go="title">◀ 뒤로</button>
  </div>
</div>

<div class="screen hidden" id="sDuo">
  <div class="card">
    <h2>둘이서 대결</h2>
    <div class="duo">
      <div class="pbox"><div><span class="dot" style="display:inline-block;background:#2a8ef0"></span> 왼쪽</div>
        <input id="nm0" maxlength="6" value="하늘이" autocomplete="off">
        <div class="small">조준 점선</div><div class="seg" id="hp_0"></div></div>
      <div class="pbox"><div><span class="dot" style="display:inline-block;background:#f0503c"></span> 오른쪽</div>
        <input id="nm1" maxlength="6" value="아빠" autocomplete="off">
        <div class="small">조준 점선</div><div class="seg" id="hp_1"></div></div>
    </div>
    <div class="small">단계</div>
    <div class="seg" id="duoLv"></div>
    <div class="rowb"><button class="btn s" data-go="title">◀ 뒤로</button><button class="btn g" id="duoStart">시작!</button></div>
  </div>
</div>

<div class="screen hidden" id="sSet">
  <div class="card">
    <h2>설정</h2>
    <button class="btn s" id="setSound"></button>
    <button class="btn s" id="setUnlock">🔓 모든 단계 열기 (부모용)</button>
    <button class="btn s d" id="setReset" style="color:#fff">진행 초기화</button>
    <button class="btn s" data-go="title">◀ 뒤로</button>
  </div>
</div>

<div class="screen hidden" id="sPause">
  <div class="card">
    <h2>잠깐 멈춤</h2>
    <button class="btn g" id="pzResume">계속하기</button>
    <button class="btn" id="pzRestart">처음부터 다시</button>
    <button class="btn s" id="pzMenu">메뉴로 나가기</button>
  </div>
</div>

<div class="screen hidden" id="sResult">
  <div class="card">
    <h2 id="rsTitle" style="font-size:2.6rem"></h2>
    <div class="stars" id="rsStars"></div>
    <div class="small" id="rsMsg" style="font-size:1.15rem"></div>
    <div class="rowb">
      <button class="btn g hidden" id="rsNext">다음 단계 ▶</button>
      <button class="btn" id="rsAgain">한 판 더!</button>
      <button class="btn s" id="rsMenu">메뉴로</button>
    </div>
  </div>
</div>

<div id="rotate">📱 ↻<br>태블릿을 가로로 돌려 주세요</div>

<script>
'use strict';
/* =====================================================================
   꼬마 포격대 — 턴제 포격 게임 (파일 하나, 외부 자원 없음)
   ===================================================================== */
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const bgC = document.createElement('canvas'), tC = document.createElement('canvas');
const H = 900, G = 620, DT = 1 / 120, WATER = H - 40, TS = 1.3, HR = 30 * TS, HR2 = HR * HR, CY = 22 * TS;
let W = 1800;
const view = { s: 1, ox: 0, oy: 0, dpr: 1, panel: 0 };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randn = () => { let u = 0; for (let i = 0; i < 4; i++) u += Math.random(); return (u - 2) * 1.73; };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- 단계 · 무기 · 풍경 ---------- */
const LV = [
  { name: '새싹', icon: '🌱', help: 'full', wind: 0, windMode: 'none', weap: ['basic', 'big'], move: false, rough: 42, carve: .55, sink: false, aiErr: 10,
    desc: '점선이 끝까지 보여요<br>바람 없음 · 탄 2종류' },
  { name: '풀잎', icon: '🌿', help: 'half', wind: 70, windMode: 'match', weap: ['basic', 'big', 'triple'], move: false, rough: 66, carve: .75, sink: false, aiErr: 7.5,
    desc: '점선이 절반만 보여요<br>약한 바람 · 탄 3종류' },
  { name: '나무', icon: '🌳', help: 'short', wind: 130, windMode: 'turn', weap: ['basic', 'big', 'triple', 'bounce', 'dirt'], move: true, rough: 96, carve: 1, sink: true, aiErr: 5.5,
    desc: '점선이 짧아요<br>바뀌는 바람 · 탄 5종류' },
  { name: '숲', icon: '🌲', help: 'tiny', wind: 200, windMode: 'turn', weap: ['basic', 'big', 'triple', 'bounce', 'dirt', 'rain', 'mole', 'tele'], move: true, rough: 128, carve: 1, sink: true, aiErr: 3.6,
    desc: '점선이 아주 짧아요<br>강한 바람 · 탄 8종류' },
  { name: '대장', icon: '👑', help: 'none', wind: 260, windMode: 'turn', weap: ['basic', 'big', 'triple', 'bounce', 'dirt', 'rain', 'mole', 'tele', 'giant', 'heal'], move: true, rough: 156, carve: 1.1, sink: true, aiErr: 2.2,
    desc: '점선이 없어요<br>거센 바람 · 탄 10종류' }
];
const WP = {

let AC = null, noiseBuf = null;
function audio() {
  if (!P.sound) return null;
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol, delay) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g2 = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g2.gain.setValueAtTime(vol || .2, t); g2.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g2).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, f0, f1, vol) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, s = a.createBufferSource(), f = a.createBiquadFilter(), g2 = a.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = 'lowpass';
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g2.gain.setValueAtTime(vol, t); g2.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f).connect(g2).connect(a.destination); s.start(t); s.stop(t + dur + .02);
}

  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  const availH = (ch - view.panel) * dpr;
  view.s = Math.min(cv.width / W, availH / H);
  view.ox = (cv.width - W * view.s) / 2;

let g = null;
function newGame(mode, lv, opt) {
  opt = opt || {};
  const demo = mode === 'demo';
  const cw = innerWidth, ch = innerHeight - (demo ? 0 : clamp(innerHeight * .2, 92, 176));
  W = clamp(Math.round(H * cw / Math.max(200, ch)), 1400, 2600);
  const L = LV[lv], seed = (Math.random() * 1e9) | 0, rnd = mulberry(seed);
  g = { mode, demo, lv, L, th: TH[lv], seed, turn: 0, state: 'banner', t: 0, time: 0, wind: 0, projs: [], parts: [], texts: [],
        shake: 0, acc: 0, dirty: true, clouds: [], flakes: [], tanks: [], mv: 0, drag: false, tutStep: 0, opt };
  // 지형
  const n = W + 1, h = new Float32Array(n), base = H * .66, a = L.rough;
  const ws = [1, 2.1, 3.4, 5.3].map((f, i) => ({ f: f * (.8 + rnd() * .45) * Math.PI * 2 / W, p: rnd() * 6.28, a: a / [1, 2, 3.4, 5][i] }));
  for (let x = 0; x < n; x++) { let y = base; for (const w of ws) y += Math.sin(x * w.f + w.p) * w.a; h[x] = clamp(y, H * .3, H - 130); }
  const xs = [W * (.09 + rnd() * .07), W * (.91 - rnd() * .07)];
  for (const x0 of xs) {
    let s = 0, c = 0; for (let x = Math.round(x0 - 45); x <= x0 + 45; x++) { s += h[x]; c++; } const avg = s / c;
    for (let x = Math.max(0, Math.round(x0 - 130)); x <= Math.min(W, x0 + 130); x++) {
      let w = clamp((130 - Math.abs(x - x0)) / 75, 0, 1); w = w * w * (3 - 2 * w); h[x] = lerp(h[x], avg, w);
    }
  }
  g.h = h; g.bare = new Uint8Array(n);
  // 포차

  for (let i = 0; i < 2; i++) {

    g.tanks.push({ i, name: names[i], col: COLS[i], x: xs[i], y: h[Math.round(xs[i])], vy: 0, hp: 100, ang: i ? 125 : 55, pow: 55,
      ai: mode === 'ai' && i === 1, help: (mode === 'duo' && opt['h' + i] && opt['h' + i] !== 'lv') ? opt['h' + i] : L.help,
      ammo, weap: 'basic', fuel: 100, alive: true, hurtT: 0, recoil: 0, tilt: 0, sunk: false, blink: rand(1, 4), roll: 0, grounded: true });
  }
  // 바람
  if (L.windMode === 'match') g.wind = (rnd() < .5 ? -1 : 1) * L.wind * (.5 + rnd() * .5);
  // 구름 · 날리는 것
  for (let i = 0; i < 7; i++) g.clouds.push({ x: rnd() * (W + 600) - 300, y: 40 + rnd() * 260, s: .6 + rnd() * .9, v: 6 + rnd() * 10 });
  for (let i = 0; i < 46; i++) g.flakes.push({ x: Math.random() * W, y: Math.random() * H, z: .5 + Math.random(), p: Math.random() * 6.28 });
  layout();
  if (!demo) { g.turn = Math.random() < .5 && mode === 'duo' ? 1 : 0; g.turn = 1 - g.turn; nextTurn(true); }
  syncHud(true);
}

function cur() { return g.tanks[g.turn]; }

function nextTurn(first) {

  if (g.L.windMode === 'turn') {
    const k = g.lv >= 4 ? 1 : .8;
    g.wind = clamp(first ? rand(-1, 1) * g.L.wind * .7 : g.wind * .4 + rand(-1, 1) * g.L.wind * k, -g.L.wind, g.L.wind);
    if (Math.abs(g.wind) < 12) g.wind = 0;

/* ---------- 포탄 계산 (미리보기와 실제가 같은 식) ---------- */
function muzzle(t, ang) { const a = ang * Math.PI / 180; return { x: t.x + Math.cos(a) * 50 * TS, y: t.y - 34 * TS - Math.sin(a) * 50 * TS, c: Math.cos(a), s: Math.sin(a) }; }
function speedOf(pow) { return 260 + pow * 8.8; }
function simulate(t, ang, pow, wantPts) {
  const m = muzzle(t, ang), sp = speedOf(pow), h = g.h, wa = g.wind, tk = g.tanks;
  let x = m.x, y = m.y, vx = m.c * sp, vy = -m.s * sp; const pts = wantPts ? [] : null;
  for (let i = 0; i < 4000; i++) {
    vx += wa * DT; vy += G * DT; x += vx * DT; y += vy * DT;
    if (pts && i % 6 === 5) pts.push(x, y);
    if (y > H + 80 || x < -600 || x > W + 600) return { pts, hit: false, x, y };
    for (let k = 0; k < 2; k++) { const o = tk[k]; if (!o.alive) continue; if (o === t && i < 30) continue;
      const dx = x - o.x, dy = y - (o.y - CY); if (dx * dx + dy * dy < HR2) return { pts, hit: true, x, y, tank: o }; }
    if (x >= 0 && x <= W && y >= h[x | 0]) return { pts, hit: true, x, y };
  }
  return { pts, hit: false, x, y };
}

function fire() {
  const t = cur(); if (g.state !== 'aim' && g.state !== 'ai') return;
  const w = t.weap, m = muzzle(t, t.ang), sp = speedOf(t.pow);
  if (w === 'heal') {
    t.ammo.heal--; t.weap = 'basic'; const up = Math.min(30, 100 - t.hp); t.hp += up;
    g.texts.push({ x: t.x, y: t.y - 125, txt: '+' + up, life: 1.4, col: '#8dff8a' });
    for (let i = 0; i < 22; i++) addPart({ type: 'spark', x: t.x + rand(-40, 40), y: t.y - rand(0, 70), vx: rand(-30, 30), vy: rand(-420, -200), life: rand(.4, .8), size: 3 });
    tone(520, 1040, .35, 'triangle', .2); g.state = 'settle'; g.t = 1; g.mv = 0; $('#hint').classList.add('hidden'); syncHud(true); return;
  }
  const shots = w === 'triple' ? [-5, 0, 5] : [0];
  for (const off of shots) {
    const a = (t.ang + off) * Math.PI / 180;
    // 가운데 탄은 미리보기와 정확히 같은 출발점·속도
    g.projs.push({ x: m.x, y: m.y, vx: Math.cos(a) * sp, vy: -Math.sin(a) * sp, w, owner: t, age: 0, n: 0, b: w === 'bounce' ? 2 : 0, rot: 0 });
  }
  if (WP[w].n !== Infinity) { t.ammo[w]--; if (t.ammo[w] <= 0) t.weap = 'basic'; }
  t.recoil = 1; g.state = 'fly'; g.acc = 0; g.mv = 0;
  for (let i = 0; i < 14; i++) addPart({ type: 'smoke', x: m.x, y: m.y, vx: m.c * rand(40, 220) + rand(-40, 40), vy: -m.s * rand(40, 220) + rand(-40, 40), life: rand(.3, .7), size: rand(8, 18), col: '240,240,240' });
  addPart({ type: 'flash', x: m.x, y: m.y, life: .14, size: 46 });
  sfx.fire(); g.shake = Math.max(g.shake, 5);
  if (!P.tut && g.lv === 0) { P.tut = true; save(); }
  $('#hint').classList.add('hidden'); syncHud(true);
}

function stepProj(p) {
  p.vx += g.wind * DT; p.vy += G * DT; p.x += p.vx * DT; p.y += p.vy * DT; p.age += DT; p.n++;
  if (p.n % 3 === 0) addPart({ type: 'trail', x: p.x, y: p.y, vx: rand(-12, 12), vy: rand(-12, 12), life: .45, size: WP[p.w].size * .9, col: p.w === 'triple' ? '255,226,130' : '235,235,235' });
  if (p.y > H + 80 || p.x < -600 || p.x > W + 600) { p.dead = true; return; }
  if (p.w === 'rain' && p.vy > 0) { p.dead = true; sfx.bounce(); addPart({ type: 'ring', x: p.x, y: p.y, life: .3, size: 50 });
    for (let i = -2; i <= 2; i++) g.projs.push({ x: p.x, y: p.y, vx: p.vx + i * 48, vy: p.vy + Math.abs(i) * 14, w: 'rainlet', owner: p.owner, age: p.age, n: p.n, b: 0, rot: 0 });
    return; }
  for (const o of g.tanks) { if (!o.alive) continue; if (o === p.owner && p.n <= 30) continue;
    const dx = p.x - o.x, dy = p.y - (o.y - CY); if (dx * dx + dy * dy < HR2) { explode(p); return; } }
  if (p.x >= 0 && p.x <= W && p.y >= g.h[p.x | 0]) {
    if (p.b > 0) {
      const xi = clamp(p.x | 0, 4, W - 4), sl = (g.h[xi + 4] - g.h[xi - 4]) / 8, len = Math.hypot(sl, 1), nx = sl / len, ny = -1 / len;
      const d = p.vx * nx + p.vy * ny; p.vx = (p.vx - 2 * d * nx) * .66; p.vy = (p.vy - 2 * d * ny) * .66;
      p.y = g.h[xi] - 2; p.b--; sfx.bounce();
      for (let i = 0; i < 6; i++) addPart({ type: 'dirt', x: p.x, y: p.y, vx: rand(-90, 90), vy: rand(-200, -60), life: .5, size: rand(3, 6), col: g.th.soil[1] });
    } else explode(p);
  }
}

function carve(cx, cy, r) {
  const h = g.h, lim = g.L.sink ? H + 60 : WATER - 60;
  for (let x = Math.max(0, Math.ceil(cx - r)); x <= Math.min(W, Math.floor(cx + r)); x++) {
    const d = Math.sqrt(r * r - (x - cx) * (x - cx)), top = cy - d, bot = cy + d;
    if (h[x] < bot) { h[x] = Math.min(lim, Math.max(h[x], h[x] >= top ? bot : h[x] + 2 * d)); g.bare[x] = 1; }
  }
  g.dirty = true;
}

function explode(p) {
  p.dead = true;
  const w = WP[p.w], x = p.x, y = p.y, r = w.r, wet = y > WATER;
  if (p.w === 'tele') { const o = p.owner, e = g.tanks[1 - o.i];
    for (const q of [[o.x, o.y - 30], [x, y - 30]]) { addPart({ type: 'flash', x: q[0], y: q[1], life: .25, size: 90 }); addPart({ type: 'ring', x: q[0], y: q[1], life: .5, size: 90 });
      for (let i = 0; i < 14; i++) { const a = rand(0, 6.28); addPart({ type: 'spark', x: q[0], y: q[1], vx: Math.cos(a) * rand(100, 400), vy: Math.sin(a) * rand(100, 400) - 200, life: rand(.3, .7), size: 3 }); } }
    let nx = clamp(x, 40, W - 40); if (Math.abs(nx - e.x) < 100) nx = clamp(e.x + (nx < e.x ? -100 : 100), 40, W - 40);
    o.x = nx; o.y = Math.min(groundAt(nx), y); o.vy = 0; tone(300, 1200, .3, 'sine', .25); return; }
  if (p.w === 'dirt') { const h = g.h;
    for (let xx = Math.max(0, Math.ceil(x - r)); xx <= Math.min(W, Math.floor(x + r)); xx++) { const d = Math.sqrt(r * r - (xx - x) * (xx - x)); h[xx] = Math.max(H * .14, h[xx] - d * 1.15); g.bare[xx] = 1; }
    g.dirty = true; g.shake = Math.max(g.shake, 8); noise(.4, 900, 60, .5);
    for (let i = 0; i < 30; i++) { const a = rand(-Math.PI, 0), v = rand(120, 420); addPart({ type: 'dirt', x: x + rand(-r, r) * .6, y: y - r * .6, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, life: rand(.5, 1), size: rand(4, 9), col: g.th.soil[(Math.random() * 3) | 0], rot: 0, vr: rand(-10, 10) }); }
    return; }
  carve(x, y, r * g.L.carve);
  if (p.w === 'mole') for (let k = 1; k <= 4; k++) carve(x, y + k * 34, 36);
  for (const o of g.tanks) {
    if (!o.alive) continue;
    const d = Math.max(0, Math.hypot(x - o.x, y - (o.y - CY)) - HR), reach = r + 12;
    if (d < reach) {
      const dmg = Math.max(1, Math.round(w.dmg * (.25 + .75 * (1 - d / reach))));
      o.hp = Math.max(0, o.hp - dmg); o.hurtT = 1.2;
      g.texts.push({ x: o.x, y: o.y - 125, txt: '-' + dmg, life: 1.3, col: '#ffe45c' });
      sfx.hit();
      if (o.hp <= 0) killTank(o);
    }
  }
  boomFx(x, y, r, wet);
  syncHud();
}
function killTank(o) {
  if (!o.alive) return; o.alive = false; o.hp = 0;
  boomFx(o.x, o.y - 20, 80, false);
}
function boomFx(x, y, r, wet) {
  const k = r / 100, th = g.th;
  g.shake = Math.max(g.shake, 8 + r * .18);
  sfx.boom(k); if (wet) sfx.splash();

function drawProj(p) {
  const w = WP[p.w], r = w.size;
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.globalCompositeOperation = 'lighter';
  let gr = ctx.createRadialGradient(0, 0, 1, 0, 0, r * 3.2); gr.addColorStop(0, 'rgba(255,220,120,.55)'); gr.addColorStop(1, 'rgba(255,160,60,0)');

  ctx.globalCompositeOperation = 'source-over';
  ctx.rotate(p.w === 'bounce' || p.w === 'big' ? p.rot : Math.atan2(p.vy, p.vx));
  gr = ctx.createRadialGradient(-r * .35, -r * .35, r * .1, 0, 0, r); gr.addColorStop(0, '#fff'); gr.addColorStop(.3, w.col[0]); gr.addColorStop(1, w.col[1]);
  ctx.fillStyle = gr; ctx.beginPath();
  if (p.w === 'mole') { ctx.moveTo(r * 1.5, 0); ctx.lineTo(-r * .6, -r); ctx.lineTo(-r, 0); ctx.lineTo(-r * .6, r); ctx.closePath(); }
  else if (p.w === 'basic' || p.w === 'triple') { ctx.ellipse(0, 0, r * 1.25, r, 0, 0, 6.3); }
  else ctx.arc(0, 0, r, 0, 6.3);
  ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.6; ctx.stroke();
  if (p.w === 'bounce') { ctx.strokeStyle = 'rgba(80,20,0,.7)'; ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke(); }
  if (p.w === 'big') { ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.arc(r * .8, -r * .8, 3 + Math.random() * 3, 0, 6.3); ctx.fill(); }
  ctx.restore();
}

function drawParts() {
  for (const p of g.parts) {
    const k = clamp(p.life / p.max, 0, 1);
    if (p.type === 'fire') { ctx.globalCompositeOperation = 'lighter'; const r = p.size * (.5 + (1 - k) * .9);
      const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r); gr.addColorStop(0, 'rgba(255,250,200,' + k + ')'); gr.addColorStop(.4, 'rgba(255,170,50,' + k * .8 + ')'); gr.addColorStop(1, 'rgba(255,60,10,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.3); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
    else if (p.type === 'smoke' || p.type === 'trail') { const r = p.size * (p.type === 'trail' ? (.4 + k * .6) : (.6 + (1 - k) * 1.3));
      ctx.fillStyle = 'rgba(' + p.col + ',' + k * (p.type === 'trail' ? .5 : .55) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.3); ctx.fill(); }
    else if (p.type === 'dirt') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0); ctx.globalAlpha = Math.min(1, k * 3); ctx.fillStyle = p.col; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .8); ctx.restore(); }
    else if (p.type === 'drop') { ctx.globalAlpha = Math.min(1, k * 2.5); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * .6, 0, 6.3); ctx.fill(); ctx.globalAlpha = 1; }
    else if (p.type === 'spark') { ctx.strokeStyle = 'rgba(255,240,170,' + k + ')'; ctx.lineWidth = p.size; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .03, p.y - p.vy * .03); ctx.stroke(); }
    else if (p.type === 'flash') { ctx.globalCompositeOperation = 'lighter'; const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size); gr.addColorStop(0, 'rgba(255,255,255,' + k + ')'); gr.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.3); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
    else if (p.type === 'ring') { ctx.strokeStyle = 'rgba(255,255,255,' + k * .7 + ')'; ctx.lineWidth = 10 * k + 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - k * k), 0, 6.3); ctx.stroke(); }

  }
}

function drawCloud(c) {
  const col = g.th.cloud, s = c.s;
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(' + col + ',.35)'; ctx.beginPath(); ctx.ellipse(0, 22, 96, 14, 0, 0, 6.3); ctx.fill();
  const gr = ctx.createLinearGradient(0, -50, 0, 30); gr.addColorStop(0, 'rgba(' + col + ',.98)'); gr.addColorStop(1, 'rgba(' + col + ',.6)');

function drawAim(t) {
  const help = t.help, m = muzzle(t, t.ang);
  // 힘 화살표
  const len = 34 + t.pow * 1.5, ex = m.x + m.c * len, ey = m.y - m.s * len;
  ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(m.x + m.c * 8, m.y - m.s * 8); ctx.lineTo(ex, ey); ctx.stroke();

  ctx.save(); ctx.translate(ex, ey); ctx.rotate(-t.ang * Math.PI / 180); ctx.fillStyle = '#fff'; ctx.strokeStyle = t.col.d; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-4, -11); ctx.lineTo(-4, 11); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  if (help === 'none') return;
  const r = simulate(t, t.ang, t.pow, true), pts = r.pts, total = pts.length / 2;
  const n = help === 'full' ? total : help === 'half' ? Math.ceil(total * .5) : help === 'short' ? Math.min(total, 12) : Math.min(total, 5);
  for (let i = 0; i < n; i++) {
    const x = pts[i * 2], y = pts[i * 2 + 1], fade = help === 'full' ? 1 : 1 - i / n * .75;
    ctx.fillStyle = 'rgba(20,40,80,' + .45 * fade + ')'; ctx.beginPath(); ctx.arc(x, y + 1.5, 6.6, 0, 6.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,' + fade + ')'; ctx.beginPath(); ctx.arc(x, y, 5, 0, 6.3); ctx.fill();
  }
  if (help === 'full' && r.hit) { const pu = 1 + Math.sin(g.time * 6) * .15;
    ctx.strokeStyle = 'rgba(20,40,80,.6)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(r.x, r.y, 20 * pu, 0, 6.3); ctx.stroke();
    ctx.strokeStyle = r.tank ? '#ffe45c' : '#fff'; ctx.lineWidth = 4.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r.x - 9, r.y - 9); ctx.lineTo(r.x + 9, r.y + 9); ctx.moveTo(r.x + 9, r.y - 9); ctx.lineTo(r.x - 9, r.y + 9); ctx.stroke(); }
}

function render() {
  const th = g.th, s = view.s;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgC, 0, 0);
  if (g.dirty) buildTerrain();
  const shx = g.shake ? (Math.random() - .5) * g.shake * view.dpr : 0, shy = g.shake ? (Math.random() - .5) * g.shake * view.dpr : 0;
  ctx.setTransform(s, 0, 0, s, view.ox + shx, view.oy + shy);
  for (const c of g.clouds) drawCloud(c);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(tC, shx, shy);
  ctx.setTransform(s, 0, 0, s, view.ox + shx, view.oy + shy);
  for (const t of g.tanks) drawTank(t);
  for (const p of g.projs) drawProj(p);
  drawParts();
  // 물
  const wl = -view.ox / s - 20, wr = (cv.width - view.ox) / s + 20, tt = g.time;
  ctx.beginPath(); ctx.moveTo(wl, H + 900);
  for (let x = wl; x <= wr + 24; x += 24) ctx.lineTo(x, WATER + Math.sin(x * .02 + tt * 1.6) * 5 + Math.sin(x * .047 - tt * 2.3) * 3);
  ctx.lineTo(wr + 24, H + 900); ctx.closePath();
  let gr = ctx.createLinearGradient(0, WATER - 8, 0, H + 260); gr.addColorStop(0, th.water[0]); gr.addColorStop(1, th.water[1]);
  ctx.globalAlpha = .84; ctx.fillStyle = gr; ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 4; ctx.beginPath();
  for (let x = wl; x <= wr + 24; x += 24) { const y = WATER + Math.sin(x * .02 + tt * 1.6) * 5 + Math.sin(x * .047 - tt * 2.3) * 3; x === wl ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke();
  // 바람에 날리는 것
  ctx.fillStyle = th.flake;
  for (const f of g.flakes) { ctx.globalAlpha = .55 + f.z * .25; ctx.beginPath();
    if (th.fl === 'snow') ctx.arc(f.x, f.y, 2.2 * f.z, 0, 6.3); else ctx.ellipse(f.x, f.y, 5 * f.z, 2.4 * f.z, f.p, 0, 6.3); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (!g.demo) {
    const t = cur();
    if ((g.state === 'aim' || g.state === 'ai') && t.alive) drawAim(t);
    if ((g.state === 'aim' || g.state === 'ai' || g.state === 'banner') && t.alive) { // 차례 표시 화살표
      const by = t.y - 176 + Math.sin(g.time * 5) * 7;
      ctx.fillStyle = '#ffe45c'; ctx.strokeStyle = '#7a4a00'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(t.x, by + 18); ctx.lineTo(t.x - 16, by - 6); ctx.lineTo(t.x + 16, by - 6); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    if (g.state === 'aim' && g.tutStep === 1) { // 첫 판 안내 손가락
      const k = (Math.sin(g.time * 2.4) + 1) / 2, d = t.i ? -1 : 1, hx = t.x + d * (140 + k * 240), hy = t.y - 150 - k * 190;
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(hx, hy, 30, 0, 6.3); ctx.fill();
      ctx.font = '60px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('👆', hx, hy - 6);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for (const x of g.texts) { ctx.globalAlpha = Math.min(1, x.life * 2); ctx.font = '900 46px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
      ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(30,20,10,.85)'; ctx.strokeText(x.txt, x.x, x.y); ctx.fillStyle = x.col; ctx.fillText(x.txt, x.x, x.y); }
    ctx.globalAlpha = 1;
  }
}

let lastKey = '';
function syncHud(full) {

    el.style.width = t.hp + '%'; el.className = t.hp > 50 ? '' : t.hp > 25 ? 'mid' : 'low'; $('#hpt' + i).textContent = Math.round(t.hp); }
  const t = cur();
  $('#aV').textContent = Math.round(t.ang <= 90 ? t.ang : 180 - t.ang) + '°';
  $('#pV').textContent = Math.round(t.pow); $('#pBar').style.width = t.pow + '%';
  if (!full) return;
  for (let i = 0; i < 2; i++) { $('#n' + i).textContent = g.tanks[i].name; $('#d' + i).style.background = g.tanks[i].col.m; $('#pl' + i).classList.toggle('on', g.turn === i && g.state !== 'over'); }
  const m = Math.abs(g.wind), n = m ? Math.max(1, Math.round(m / 260 * 5)) : 0;
  $('#windArrow').textContent = n ? (g.wind > 0 ? '▶'.repeat(n) : '◀'.repeat(n)) : '없음';
  $('#windLbl').textContent = n ? '바람 ' + ['', '살랑', '약함', '보통', '강함', '거셈'][n] : '바람';

  const key = g.turn + '|' + t.weap + '|' + g.L.weap.map(k => t.ammo[k]).join();
  if (key !== lastKey) { lastKey = key; const box = $('#gWeap'); box.innerHTML = ''; box.classList.toggle('many', many);
    const mk = (k, withDs) => { const w = WP[k], b = document.createElement('button');
      b.className = 'wp' + (t.weap === k ? ' sel' : '') + (t.ammo[k] <= 0 ? ' out' : '');
      b.innerHTML = '<span class="ic">' + w.icon + '</span><span class="nm">' + w.name + '</span>' + (withDs ? '<span class="ds">' + w.ds + '</span>' : '') + (w.n === Infinity ? '' : '<span class="ct">' + t.ammo[k] + '</span>');
      return b; };
    const choose = k => e => { e.preventDefault(); if (g.state !== 'aim') return; cur().weap = k; sfx.click(); pick.classList.add('hidden'); syncHud(true); };
    if (!many) { for (const k of g.L.weap) { const b = mk(k); b.addEventListener('pointerdown', choose(k)); box.appendChild(b); } }

      box.appendChild(b); pick.innerHTML = '';
      for (const k of g.L.weap) { const c = mk(k, true); c.addEventListener('pointerdown', choose(k)); pick.appendChild(c); }
    } }
}

function buildLevels() {
  const box = $('#lvList'); box.innerHTML = '';
  LV.forEach((L, i) => { const open = i < P.unlocked, b = document.createElement('button'), w = Math.min(3, P.wins[i] || 0);

    b.innerHTML = '<span class="ic">' + (open ? L.icon : '🔒') + '</span><span class="nm">' + (i + 1) + ' ' + L.name + '</span><span class="ds">' + L.desc + '</span><span class="st">' + '★'.repeat(w) + '☆'.repeat(3 - w) + '</span>';

function buildDuo() {
  const opts = [['lv', '단계대로'], ['full', '끝까지'], ['short', '짧게'], ['none', '없음']];
  for (let i = 0; i < 2; i++) { const box = $('#hp_' + i); box.innerHTML = '';
    for (const [k, nm] of opts) { const b = document.createElement('button'); b.textContent = nm; b.className = duo['h' + i] === k ? 'sel' : '';
      b.addEventListener('click', () => { duo['h' + i] = k; sfx.click(); buildDuo(); }); box.appendChild(b); } }
  const lb = $('#duoLv'); lb.innerHTML = ''; duo.lv = Math.min(duo.lv, P.unlocked - 1);
  LV.forEach((L, i) => { if (i >= P.unlocked) return; const b = document.createElement('button'); b.textContent = L.icon + ' ' + L.name; b.className = duo.lv === i ? 'sel' : '';
    b.addEventListener('click', () => { duo.lv = i; sfx.click(); buildDuo(); }); lb.appendChild(b); });
}
function buildSet() { $('#setSound').textContent = P.sound ? '🔊 소리 켜짐' : '🔇 소리 꺼짐'; }

function showResult() {
  const alive = g.tanks.filter(t => t.alive), win = alive.length === 1 ? alive[0] : null;
  let title, msg = '', stars = '', next = false;
  if (g.mode === 'ai') {
    if (win && win.i === 0) {
      title = '🎉 이겼어요!'; sfx.win();
      P.wins[g.lv] = (P.wins[g.lv] || 0) + 1; const w = Math.min(3, P.wins[g.lv]); stars = '★'.repeat(w) + '☆'.repeat(3 - w);
      if (P.wins[g.lv] >= 3 && P.unlocked === g.lv + 1 && g.lv < 4) { P.unlocked++; msg = '🔓 새 단계 「' + LV[g.lv + 1].name + '」 이(가) 열렸어요!'; }
      else if (w < 3) msg = (3 - w) + '번 더 이기면 다음 단계가 열려요';
      else msg = g.lv === 4 ? '최고 단계의 대장이에요!' : '참 잘했어요!';
      next = g.lv < 4 && P.unlocked > g.lv + 1; save();
    } else { title = win ? '😢 아쉬워요!' : '🤝 비겼어요!'; msg = '다시 도전해 봐요!'; sfx.lose(); const w = Math.min(3, P.wins[g.lv] || 0); stars = '★'.repeat(w) + '☆'.repeat(3 - w); }
  } else { title = win ? '🎉 ' + win.name + ' 승리!' : '🤝 비겼어요!'; msg = '멋진 대결이었어요!'; sfx.win(); }
  $('#rsTitle').textContent = title; $('#rsStars').textContent = stars; $('#rsStars').classList.toggle('hidden', !stars);
  $('#rsMsg').textContent = msg; $('#rsNext').classList.toggle('hidden', !next);
  show('sResult');
}

/* =====================================================================
   입력
   ===================================================================== */
function toWorld(e) { return { x: (e.clientX * view.dpr - view.ox) / view.s, y: (e.clientY * view.dpr - view.oy) / view.s }; }
function aimAt(e) {
  const t = cur(), p = toWorld(e), dx = p.x - t.x, dy = (t.y - 34 * TS) - p.y;
  let a = Math.atan2(dy, dx) * 180 / Math.PI; if (a < 0) a = dx >= 0 ? 0 : 180;
  t.ang = clamp(a, 0, 180); t.pow = clamp(Math.round(Math.hypot(dx, dy) / 5.4), 5, 100);
  if (g.tutStep === 1) { g.tutStep = 2; tutorial(); }
  syncHud();
}
function canAim() { return g && !g.demo && !paused && g.state === 'aim' && !cur().ai; }
cv.addEventListener('pointerdown', e => { audio(); $('#wpick').classList.add('hidden'); if (!canAim()) return; g.drag = true; try { cv.setPointerCapture(e.pointerId); } catch (x) {} aimAt(e); });
cv.addEventListener('pointermove', e => { if (g && g.drag && canAim()) aimAt(e); });
const endDrag = () => { if (g) g.drag = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

function adj(what, d) { if (!canAim()) return; const t = cur();
  if (what === 'a') { const el = t.ang <= 90 ? t.ang : 180 - t.ang, ne = clamp(el + d, 0, 90); t.ang = t.ang <= 90 ? ne : 180 - ne; } else t.pow = clamp(t.pow + d, 5, 100);
  syncHud(); }
function holdBtn(id, fn) { const b = $(id); let tm = null, iv = null;
  const stop = () => { clearTimeout(tm); clearInterval(iv); tm = iv = null; };
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); fn(); sfx.click(); stop(); tm = setTimeout(() => { iv = setInterval(fn, 55); }, 320); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, stop); }
holdBtn('#aM', () => adj('a', -1)); holdBtn('#aP', () => adj('a', 1)); holdBtn('#pM', () => adj('p', -1)); holdBtn('#pP', () => adj('p', 1));
function moveBtn(id, d) { const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); if (canAim()) { g.mv = d; b.classList.add('act'); } });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => { if (g && g.mv === d) g.mv = 0; b.classList.remove('act'); }); }
moveBtn('#mvL', -1); moveBtn('#mvR', 1);
$('#fire').addEventListener('pointerdown', e => { e.preventDefault(); audio(); if (canAim()) fire(); });
addEventListener('keydown', e => { if (!canAim()) return;
  if (e.key === 'ArrowUp') adj('a', 1); else if (e.key === 'ArrowDown') adj('a', -1); else if (e.key === 'ArrowRight') adj('p', 1); else if (e.key === 'ArrowLeft') adj('p', -1);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); fire(); } });

document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { audio(); sfx.click(); const k = b.dataset.go;
  if (k === 'levels') { buildLevels(); show('sLevels'); } else if (k === 'duo') { buildDuo(); show('sDuo'); } else if (k === 'set') { buildSet(); show('sSet'); } else show('sTitle'); }));
$('#duoStart').addEventListener('click', () => { sfx.click(); startDuo(); });
$('#btnPause').addEventListener('click', () => { if (g.state === 'over') return; paused = true; sfx.click(); show('sPause'); });
$('#pzResume').addEventListener('click', () => { paused = false; sfx.click(); show(null); });
$('#pzRestart').addEventListener('click', () => { sfx.click(); g.mode === 'ai' ? startAI(g.lv) : startDuo(); });
$('#pzMenu').addEventListener('click', () => { sfx.click(); goTitle(); });
$('#rsAgain').addEventListener('click', () => { sfx.click(); g.mode === 'ai' ? startAI(g.lv) : startDuo(); });
$('#rsNext').addEventListener('click', () => { sfx.click(); startAI(Math.min(4, g.lv + 1)); });
$('#rsMenu').addEventListener('click', () => { sfx.click(); goTitle(); });
$('#setSound').addEventListener('click', () => { P.sound = !P.sound; save(); buildSet(); sfx.click(); });
$('#setUnlock').addEventListener('click', () => { P.unlocked = 5; save(); sfx.win(); $('#setUnlock').textContent = '✅ 모든 단계가 열렸어요'; });
$('#setReset').addEventListener('click', e => { const b = e.currentTarget;
  if (b.dataset.sure) { P.unlocked = 1; P.wins = [0, 0, 0, 0, 0]; P.tut = false; save(); delete b.dataset.sure; b.textContent = '초기화했어요'; $('#setUnlock').textContent = '🔓 모든 단계 열기 (부모용)'; }
  else { b.dataset.sure = '1'; b.textContent = '정말요? 한 번 더 누르면 지워져요'; } });
$('#btnFull').addEventListener('click', () => { const d = document.documentElement;
  try { if (document.fullscreenElement) document.exitFullscreen(); else (d.requestFullscreen || d.webkitRequestFullscreen).call(d); } catch (e) {} });
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.target.tagName !== 'INPUT') e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { last = 0; });

/* =====================================================================
   시작
   ===================================================================== */
let last = 0;
function frame(ts) {
  const dt = last ? Math.min(.05, (ts - last) / 1000) : .016; last = ts;
  if (g) { if (!paused) update(dt); render(); }
  requestAnimationFrame(frame);
}
goTitle();
// 확인용: 주소 뒤에 #ai3 처럼 붙이면 그 단계로 바로 시작 (#duo3 은 둘이서 대결, s 는 바로 발사, @숫자 는 그만큼 미리 진행)
(function () { const sc = /^#scr-(\w+)/.exec(location.hash); if (sc) { buildLevels(); buildDuo(); buildSet(); show(sc[1]); return; }
  const m = /^#(ai|duo)([1-5])(s?)(?:@(\d+))?(w?)/.exec(location.hash); if (!m) return; P.sound = false; save = () => {};
  if (m[1] === 'ai') startAI(+m[2] - 1); else { duo.lv = +m[2] - 1; startDuo(); }
  if (m[5]) { killTank(g.tanks[1]); g.state = 'settle'; g.t = .1; }
  if (m[3]) { g.state = 'aim'; fire(); }
  const log = []; let prev = '';
  for (let i = 0; i < (+m[4] || 0); i++) { update(1 / 60); const k = g.state + ':' + g.turn; if (k !== prev) { prev = k; log.push(i + ' ' + k + ' hp=' + g.tanks.map(t => Math.round(t.hp)).join('/')); } }
  if (/p$/.test(location.hash)) { $('#wpick').style.bottom = 'calc(' + view.panel + 'px + .8rem)'; $('#wpick').classList.remove('hidden'); }
  if (m[4]) console.log('TESTLOG ' + log.join(' | ') + ' || bare=' + g.bare.reduce((a, b) => a + b, 0)); })();
requestAnimationFrame(frame);
</script>
</body>
